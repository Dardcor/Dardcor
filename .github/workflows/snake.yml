name: Generate Snake Animation

on:
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      # ═══════════════════════════════════════════
      # 🐍 Dark Theme Snake (Ocean Gradient)
      # ═══════════════════════════════════════════
      - name: Generate Snake - Dark Mode
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Dardcor
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00f7ff&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39d353

      # ═══════════════════════════════════════════
      # 🌊 Ocean Blue Snake (Signature Style)
      # ═══════════════════════════════════════════
      - name: Generate Snake - Ocean Theme
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Dardcor
          outputs: |
            dist/github-snake-ocean.svg?palette=github-dark&color_snake=#00f7ff&color_dots=#0d1117,#0a2f4e,#0d4f8b,#1a7fd4,#00f7ff

      # ═══════════════════════════════════════════
      # 🎮 Animated GIF Snake
      # ═══════════════════════════════════════════
      - name: Generate Snake - Animated GIF
        uses: Platane/snk@v3
        with:
          github_user_name: Dardcor
          outputs: |
            dist/github-snake.gif?color_snake=#00f7ff&color_dots=#0d1117,#0a2f4e,#0d4f8b,#1a7fd4,#00f7ff

      # ═══════════════════════════════════════════
      # 🚀 Deploy to Output Branch
      # ═══════════════════════════════════════════
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
