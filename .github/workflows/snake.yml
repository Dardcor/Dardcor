name: Generate Snake Animation

on:
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      # ═══════════════════════════════════════════
      # 🐍 Purple Theme Animated Snake
      # ═══════════════════════════════════════════
      - name: Generate Snake - Purple Theme GIF
        uses: Platane/snk@v3
        with:
          github_user_name: Dardcor
          outputs: |
            dist/github-snake.gif?color_snake=#a855f7&color_dots=#0d0b1a,#1e0a3c,#3b1d7a,#7c3aed,#a855f7

      # ═══════════════════════════════════════════
      # 🚀 Deploy to Output Branch
      # ═══════════════════════════════════════════
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
