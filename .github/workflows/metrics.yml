name: Generate GitHub Profile Metrics

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ═══════════════════════════════════════════
      # 📊 GitHub Stats Card
      # ═══════════════════════════════════════════
      - name: GitHub Stats
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Dardcor
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 5%
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # ═══════════════════════════════════════════
      # 💻 Top Languages
      # ═══════════════════════════════════════════
      - name: Top Languages
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Dardcor
          template: classic
          base: ""
          config_timezone: Asia/Jakarta
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

      # ═══════════════════════════════════════════
      # 🏆 Achievements
      # ═══════════════════════════════════════════
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Dardcor
          template: classic
          base: ""
          config_timezone: Asia/Jakarta
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

      # ═══════════════════════════════════════════
      # 📈 Contribution Graph (Heatmap)
      # ═══════════════════════════════════════════
      - name: Contribution Habits
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/habits.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Dardcor
          template: classic
          base: ""
          config_timezone: Asia/Jakarta
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: 0%
